<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>机械蛛 · 结构</title>
</head>
<body>
<main id="sheet">
  <div id="stage"></div>

  <aside id="agent">
    <form id="agent-form">
      <input id="agent-goal" value="吃掉场景里的苹果。" autocomplete="off" />
      <button type="submit">派出 AI</button>
    </form>
    <div id="agent-log"></div>
  </aside>

  <aside id="keys">
    <p><kbd>W</kbd> 前进　<kbd>S</kbd> 后退　<kbd>Shift</kbd> 加速</p>
    <p><kbd>A</kbd> 头向左转　<kbd>D</kbd> 头向右转</p>
    <p><kbd>R</kbd> 升高　<kbd>F</kbd> 降低</p>
    <p><kbd>空格</kbd> 暂停　拖动旋转视角</p>
  </aside>
</main>
<script type="module" src="/src/client/main.ts"></script>
</body>
</html>
