# 复制为 config.yaml 后填入自己的密钥。config.yaml 已被 git 忽略。
agent:
  # deepseek | gateway | openai-compatible
  provider: deepseek
  model: deepseek-chat
  # 留空则读环境变量：DEEPSEEK_API_KEY / AI_GATEWAY_API_KEY / OPENAI_API_KEY
  apiKey: ""
  # 仅自建或代理端点需要；deepseek 官方端点留空即可
  baseURL: ""
  # 一次任务最多允许多少轮工具调用
  maxSteps: 20

server:
  port: 3000
